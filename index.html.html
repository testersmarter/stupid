*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0005;}
.card{width:680px;margin:0 auto;position:relative;overflow:hidden;background:#0a0005;}

.title-area{text-align:center;padding:20px 10px 10px;background:#0a0005;}
.t1{font-family:'Permanent Marker',cursive;font-size:44px;color:#ff2200;display:block;text-shadow:0 0 20px #ff4400,0 0 40px #ff0000;letter-spacing:3px;}
.t2{font-family:'Permanent Marker',cursive;font-size:28px;color:#ffaa00;display:block;text-shadow:0 0 10px #ff6600;letter-spacing:2px;margin-top:4px;}
.t3{font-family:'Caveat',cursive;font-size:20px;color:#cc66ff;display:block;margin-top:6px;font-style:italic;}

.scene{position:relative;width:680px;height:700px;background:#0a0005;overflow:hidden;}

.bg-fire-left{position:absolute;bottom:0;left:0;width:200px;height:400px;display:flex;gap:2px;align-items:flex-end;}
.bg-fire-right{position:absolute;bottom:0;right:0;width:200px;height:400px;display:flex;gap:2px;align-items:flex-end;justify-content:flex-end;}

.throne-base{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:320px;}

.queen-body{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);width:280px;text-align:center;}

.face-circle{width:180px;height:220px;border-radius:50% 50% 45% 45%;overflow:hidden;margin:0 auto;border:4px solid #ffaa00;box-shadow:0 0 20px #ff6600,0 0 40px #ff4400;position:relative;z-index:10;}
.face-circle img{width:100%;height:130%;object-fit:cover;object-position:center top;margin-top:-10px;}

.crown-svg{display:block;margin:0 auto;margin-bottom:-8px;position:relative;z-index:11;}

.queen-dress{position:relative;z-index:9;margin-top:-10px;}

.smoke-left{position:absolute;top:100px;left:40px;font-size:60px;opacity:0.3;animation:smokefloat 3s ease-in-out infinite alternate;}
.smoke-right{position:absolute;top:80px;right:40px;font-size:50px;opacity:0.25;animation:smokefloat 2.5s ease-in-out infinite alternate;}
@keyframes smokefloat{0%{transform:translateY(0) rotate(-5deg);}100%{transform:translateY(-20px) rotate(5deg);}}

.bottom-text{background:#0a0005;padding:16px;text-align:center;border-top:2px solid #ff4400;}
.bt1{font-family:'Permanent Marker',cursive;font-size:22px;color:#ffdd00;display:block;}
.bt2{font-family:'Caveat',cursive;font-size:18px;color:#ff6600;display:block;margin-top:4px;}
